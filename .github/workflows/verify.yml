name: Container verification and Pages artifact
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "검증 후 GitHub Pages에 게시"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Match nonroot container user to the Linux bind workspace owner
        run: |
          echo "BLOG_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BLOG_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build Linux tool image
        run: docker compose build
      - name: Install frozen dependencies as nonroot user
        run: docker compose run --rm blog pnpm install --frozen-lockfile
      - name: Same verification as local Docker
        run: docker compose run --rm blog pnpm verify
      - name: Build repository-specific Pages artifact
        env:
          PAGES_SITE_URL: ${{ vars.SITE_URL }}
          PAGES_BASE_PATH: ${{ vars.BASE_PATH }}
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          base="/$repo/"
          if [[ "${repo,,}" == "$owner.github.io" ]]; then base="/"; fi
          site="${PAGES_SITE_URL:-https://$owner.github.io}"
          base="${PAGES_BASE_PATH:-$base}"
          docker compose run --rm -e SITE_URL="$site" -e BASE_PATH="$base" blog pnpm build
          docker compose run --rm -e SITE_URL="$site" blog node scripts/check-dist.mjs dist "$base"
      - name: Save browser evidence and dependency risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: artifacts/
          retention-days: 7
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 7


  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static artifact
        id: deployment
        uses: actions/deploy-pages@v4
